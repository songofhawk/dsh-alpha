# dsh-alpha bundle patch: single-machine control loop (stage 0) over dsh-base.
#
# The control plane (catalog + task engine + approval broker) mounts as one
# host-plane row `dsh-alpha`; the alpha-runner drives one one-shot task through
# an agent that mounts the `alpha` preset (directory/dispatch tools). The
# persona is filled by the preset's strategy prompt, so no persona row is
# needed here beyond the base default.

- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # One-shot task parsing from the CLI positional (`dsh --profile alpha "<task>"`).
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Preset roster (~/.dsh/.agent-presets 用户 preset 即由该服务发现)。
    # headless 形态的 base 不含 web-app，需显式挂载；默认 preset 即 alpha。
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: alpha

    # Alpha control plane (host plane): publishes alphaCatalog / alphaTasks /
    # alphaApprovals / alphaEngine services consumed by the preset tools.
    - id: dsh-alpha
      name: 'dsh-alpha'

    # One-shot driver: mounts the `alpha` preset and runs the joined task.
    - id: alpha-runner
      name: 'dsh-alpha/runner'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task