- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    - id: alpha-runner
      name: 'dsh-alpha/runner'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task

    # 0.2.x：preset 改为声明式组合（dsh-agent-preset），由 registry 提供
    # agentPresets 服务；不再有 ~/.dsh/.agent-presets 文件系统发现。
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: alpha

    - id: preset-alpha
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: alpha
        name: alpha 主控
        description: 主控 agent 分派 preset：目录查询 / 任务派发 / 状态轮询 / 审批工具 + 分派策略提示词。
        order: 100
        plugins:
          - id: alpha-tools
            name: 'dsh-alpha/tools'
