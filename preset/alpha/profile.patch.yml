- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    - id: alpha-runner
      name: 'dsh-alpha/runner'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task

    # 0.2.x：preset 改为声明式组合（dsh-agent-preset），由 registry 提供
    # agentPresets 服务；不再有 ~/.dsh/.agent-presets 文件系统发现。
    # alpha / alpha-router 两个声明行在 bundle 的 cordis.patch.yml 里，Web 也共用。
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: alpha
