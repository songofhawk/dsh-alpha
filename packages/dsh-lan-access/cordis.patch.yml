# DSH Web trusted-LAN access bundle.
#
# The webserver patch must restate the complete config because DSH profile
# config overrides replace, rather than deep-merge, a matched row's config.
- id: webserver
  config:
    host: "0.0.0.0"
    port: !!js ctx.webStartup.port ?? 3080

- insert:
    - id: dsh-lan-access
      name: 'dsh-lan-access'
